# How the parts map onto each format. Content lives in parts; this file only maps time.
# A session's minutes must cover the full minutes of every part it lists (bun run check sums them).
# Live plus home minutes, or the split, must add up to the session's minutes: no step is left out.

[four-weeks]
sessions = [
  { name = "first block", parts = ["meet-the-world", "design"], minutes = 220, live_minutes = 150, home_minutes = 70 },
  { name = "second block", parts = ["build"], minutes = 285, live_minutes = 150, home_minutes = 135 },
  { name = "third block", parts = ["deploy"], minutes = 215, live_minutes = 150, home_minutes = 65 },
  { name = "fourth block", parts = ["operate"], minutes = 225, live_minutes = 150, home_minutes = 75 },
  { name = "closing block", parts = ["run-the-agent-on-langgraph"], minutes = 30, live_minutes = 0, home_minutes = 30 },
]

[one-day]
# One day holds 480 minutes of steps. Only the core steps run live; the rest are finished after the day.
# bun run check: each core list names real steps from its parts, each core_minutes is the sum of those
# steps, and the core minutes of all blocks fit in the day's minutes.
minutes = 480
sessions = [
  { name = "the design block", parts = ["meet-the-world", "design"], minutes = 220, core_minutes = 130, core = ["meet-the-world", "place-it-on-the-map", "write-the-hire-letter", "turn-the-hire-into-tests", "price-the-outcome"] },
  { name = "the build block", parts = ["build"], minutes = 285, core_minutes = 180, core = ["answer-the-contract", "call-the-tools", "pay-one-invoice", "close-on-the-record", "hold-the-must-never", "ask-for-approval", "check-who-approves"] },
  { name = "the deploy block", parts = ["deploy"], minutes = 215, core_minutes = 45, core = ["save-progress", "pay-once-after-a-crash"] },
  { name = "the operate block", parts = ["operate"], minutes = 225, core_minutes = 75, core = ["show-cost-per-outcome", "run-the-swap-gate", "refuse-a-bad-model"] },
  { name = "the closing block", parts = ["run-the-agent-on-langgraph"], minutes = 30, core_minutes = 0, core = [] },
]

[four-evenings]
sessions = [
  { name = "first evening", parts = ["meet-the-world", "design"], minutes = 220, live_step_minutes = 160, qa_minutes = 20, home_minutes = 60 },
  { name = "second evening", parts = ["build"], minutes = 285, live_step_minutes = 160, qa_minutes = 20, home_minutes = 125 },
  { name = "third evening", parts = ["deploy"], minutes = 215, live_step_minutes = 160, qa_minutes = 20, home_minutes = 55 },
  { name = "fourth evening", parts = ["operate"], minutes = 225, live_step_minutes = 160, qa_minutes = 20, home_minutes = 65 },
  { name = "closing evening", parts = ["run-the-agent-on-langgraph"], minutes = 30, live_step_minutes = 0, qa_minutes = 0, home_minutes = 30 },
]

[twelve-saturdays]
# The check needs one entry to cover both parts; split shows how its 220 minutes spread over three sessions.
sessions = [
  { name = "first sessions", parts = ["meet-the-world", "design"], minutes = 220, split = [70, 90, 60] },
  { name = "build sessions", parts = ["build"], minutes = 285, split = [95, 95, 95] },
  { name = "deploy sessions", parts = ["deploy"], minutes = 215, split = [70, 75, 70] },
  { name = "operate sessions", parts = ["operate"], minutes = 225, split = [75, 75, 75] },
  { name = "closing sessions", parts = ["run-the-agent-on-langgraph"], minutes = 30, split = [30] },
]

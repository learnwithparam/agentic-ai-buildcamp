# The Operate part's sample employee: the reference clerk, run in production. See reference/CONTRACT.md.
# MODEL_ROLE (smart by default) and REPLAY_DIR pick the model; the swap gate sets both.

[hire]
name = "freight-audit-clerk"
outcome = "Each carrier invoice is paid once at the rate confirmation's amount, or disputed with a reason code the papers support"
starts_by = ["person"]
lives = "one job"

[contract]
version = "1"
mode = "http"
start = "bun start.ts"
url = "http://localhost:7701"
traces = "traces"

[budget]
max_steps = 12
max_usd_per_job = 0.05
max_usd_per_day = 5

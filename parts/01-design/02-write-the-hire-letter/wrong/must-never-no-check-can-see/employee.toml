[hire]
employee = "freight-audit-clerk"
outcome = "Each carrier invoice is paid or disputed per the rate confirmation and the proof of delivery"
starts_by = "event"
lives = "one case"

[hire.metric]
name = "cost per invoice settled"
query = "SELECT COUNT(*) FROM invoices WHERE status IN ('paid', 'disputed')"

[hire.must_never]
rule = "Be careful with money and never upset a carrier"
write = "be careful"
check = "the team reviews the bank statement"

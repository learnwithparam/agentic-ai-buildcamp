# A common mistake: see compose.yaml and the Dockerfile in this folder.
# The checker reads this file to start the employee. See reference/CONTRACT.md.

[hire]
name = "freight-audit-clerk"
outcome = "Each carrier invoice is paid or disputed per the rate confirmation and the proof of delivery."
metric = "Cost per invoice settled: model spend divided by invoices the ledger shows paid once or disputed with a supported reason."
must_never = "Pay an invoice twice, or pay above the rate confirmation without the finance lead's approval."
starts_by = ["person", "event", "schedule"]
lives = "one job"

[contract]
version = "1"
mode = "http"
start = "bun start.ts"
url = "http://localhost:7701"
traces = "traces"

[budget]
max_steps = 12
max_usd_per_job = 0.05
max_usd_per_day = 5

# The sample solution: the reference employee. See reference/ for its code.
# bun run finds the repo's package.json from any folder inside the repo, so this file also works
# when you copy it into employee/.
[hire]
name = "freight-audit-clerk"

[contract]
version = "1"
mode = "http"
start = "bun run reference-employee"
url = "http://localhost:7701"
traces = "traces"

[budget]
max_steps = 12
max_usd_per_job = 0.05
max_usd_per_day = 5

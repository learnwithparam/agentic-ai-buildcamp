# A common mistake: the agent is a script that runs and exits, not a service that answers the contract.
[hire]
name = "freight-audit-clerk"

[contract]
version = "1"
mode = "http"
start = "bun ../../../faulty.ts naive-script"
url = "http://localhost:7701"
traces = "traces"

[budget]
max_steps = 12
max_usd_per_job = 0.05
max_usd_per_day = 5

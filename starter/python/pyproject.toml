[project]
name = "freight-audit-clerk"
version = "0.1.0"
description = "Starter employee for the Agentic AI Buildcamp, contract version 1"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "anthropic==2.8.0",
]

[tool.uv]
package = false

# Python steps follow the same readable-code rules as TypeScript. See STANDARD.md, "Readable code".
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "C90", "PLR0913", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-nested-blocks = 3

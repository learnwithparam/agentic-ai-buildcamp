name: checkpoints
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkpoints
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Mermaid renderer
        run: npm install -g @mermaid-js/mermaid-cli@11.6.0
      - name: Start the stack
        run: bun run up
      - name: Gate on main
        run: bun run check
      - name: Name the committer for the tag commits
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
      - name: Prove and build every checkpoint tag
        run: bun scripts/checkpoints.ts --prove --tag
      - name: Push all tags together
        run: |
          tags=$(git tag --list 'checkpoint/*' 'lab/*')
          git push --atomic --force origin $tags

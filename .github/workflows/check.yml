name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lesson 11. The session and permission tests run against the real services, started from
      # the same compose file as the workshop, with throwaway secrets. Keycloak is not needed:
      # the auth test signs its own tokens.
      - name: Start Postgres and OpenFGA
        run: |
          umask 077
          for name in POSTGRES_PASSWORD KEYCLOAK_DB_PASSWORD OPENFGA_DB_PASSWORD MEDINFO_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD FGA_API_TOKEN; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
          medinfo="$(grep '^MEDINFO_DB_PASSWORD=' .env | cut -d= -f2)"
          echo "TEST_DATABASE_URL=postgresql://medinfo:$medinfo@localhost:5442/medinfo_test" >> .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --wait postgres openfga

      - name: Typecheck, tests and repo checks
        run: npm run check

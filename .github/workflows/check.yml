name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres and OpenFGA
        run: ./.github/start-test-services.sh

      - name: Typecheck, tests and repo checks
        run: npm run check

      # The page checks render every diagram with mermaid-cli, the same tool live-labs uses.
      # It is installed here, not as a dev dependency, so learners do not download a browser.
      - name: Install mermaid-cli
        run: npm i -g @mermaid-js/mermaid-cli@11.6.0

      - name: Lesson pages, walkthrough and diagrams
        run: npm run check:pages

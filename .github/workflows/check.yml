name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - name: Install the Mermaid renderer
        run: npm install -g @mermaid-js/mermaid-cli@11.6.0
      - run: bun run up
      - run: bun run check

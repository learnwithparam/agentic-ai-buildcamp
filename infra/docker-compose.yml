# The course stack. Postgres holds the data and the vectors. Phoenix holds the traces.
# Nothing is saved between runs, so every start is a fresh start.
name: buildcamp

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: buildcamp
      POSTGRES_PASSWORD: buildcamp
      POSTGRES_DB: buildcamp
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildcamp -d buildcamp"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    ports:
      - "6006:6006"

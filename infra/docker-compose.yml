# The course stack. Postgres holds the data and the vectors. Phoenix holds the traces.
# Nothing is saved between runs, so every start is a fresh start.
name: buildcamp

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: buildcamp
      POSTGRES_PASSWORD: buildcamp
      POSTGRES_DB: buildcamp
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildcamp -d buildcamp"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The model gateway. It starts only with: bun run up --gateway
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:v1.109.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-buildcamp-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request as u; u.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    environment:
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "6006:6006"
